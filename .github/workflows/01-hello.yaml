name: 01-Hello
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
permissions:
  contents: read
jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: "saludar repo"
        env:
          RAMA: ${{github.ref_name}}
          REPO: ${{github.repository}}
          EVENTO: ${{github.event_name}}
        run: |
             echo "Saludos desde la rama $RAMA del repo $REPO"
             echo "Evento disparado $EVENTO"
      - name: "checkout"
        uses: actions/checkout@v4
      - name: "dir actual"
        run: pwd
      - name: "listar"
        run: ls -latr