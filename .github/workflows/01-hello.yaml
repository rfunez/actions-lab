name: 01-Hello
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
permissions:
  contents: read
jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: "saludar repo"
        run: echo "Saludos desde la rama ${{github.ref_name}} del repo ${{github.repository}}"
      - name: "dir actual"
        run: pwd
      - name: "listar"
        run: ls -latr