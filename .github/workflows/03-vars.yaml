name: 03-VarsSecrets
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      env_versions:
        required: true
        description: "Select node version"
        type: choice
        options:
          - develop
          - production
      
env:
  APP: java

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: print-env
        run: |
             echo "Variable from wf: ${{env.APP}}"
             echo "Variable from github: ${{vars.APP}}"
             echo "Node version in repository: ${{vars.NODE_VERSION}}"
             echo "AWS secret key: ${{secrets.AWS_SECRET_KEY}}" | base64 -d
