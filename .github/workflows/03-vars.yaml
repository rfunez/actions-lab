name: 02-VarsSecrets
on:
  push:
    branches:
      - develop
  workflow_dispatch:
env:
  APP: java

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: print-env
        run: |
             echo "Variable from wf: ${{env.APP}}"
             echo "Variable from github: ${{vars.APP}}"
